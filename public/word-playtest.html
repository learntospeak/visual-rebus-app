<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clue Canvas · Puzzle playground</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f2ea;color:#173f39;font:16px system-ui,sans-serif}main{max-width:620px;margin:auto;padding:24px 18px 50px}header{display:flex;justify-content:space-between;align-items:center}a{color:inherit}h1{font-size:32px;letter-spacing:-1px}p{line-height:1.5}button,input,textarea{font:inherit}button{min-height:48px;border:1px solid #cbd8d2;border-radius:14px;padding:12px 16px;background:#fffdf7;color:#17483e;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #bd8b32;outline-offset:3px}button.primary,button[aria-pressed=true]{background:#18594c;color:white}.tabs,.actions{display:flex;gap:10px;margin:18px 0}.tabs button,.actions button{flex:1}.card{padding:22px;background:#fffdf8;border:1px solid #dfd7c2;border-radius:24px;box-shadow:0 12px 30px #173f3909}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase}.board{min-height:300px;background:linear-gradient(140deg,#e9eeea,#f8f1df);border-radius:18px;padding:16px;display:grid;gap:8px;align-content:center;margin:20px 0}.zone{min-height:66px;border:1px dashed #8b9e91;background:#ffffff70;display:flex;justify-content:center;align-items:center;gap:8px}.zone span{font-size:12px;color:#61796e}.token{background:#18594c;color:#fff;box-shadow:0 3px 0 #103b32;font-weight:750;letter-spacing:1px}.bank{min-height:65px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}.line{border-top:3px solid #a18b56}.anchor{text-align:center;font-size:25px;font-weight:800;letter-spacing:4px;padding:10px}.box{border:3px solid #a18b56;border-radius:10px;padding:8px}.words{display:grid;gap:12px;margin:30px 0}.word{padding:20px;text-align:center;background:#e9f1ed;border-radius:14px;font-size:24px;font-weight:750;letter-spacing:2px}input,textarea{width:100%;padding:15px;border:1px solid #acbdb5;border-radius:12px;background:white;color:#173f39}textarea{min-height:80px;resize:vertical}#message{min-height:48px;font-weight:650}#hintText{color:#715b32}progress{width:100%;accent-color:#22614e;height:10px}.muted{font-size:13px;color:#61756b}.feedback{margin-top:24px;border-top:1px solid #dfd7c2;padding-top:18px}.ratings{display:flex;gap:6px;flex-wrap:wrap}.ratings button{font-size:14px;flex:1}.success{color:#196143}@media(prefers-reduced-motion:no-preference){.success{animation:pop .25s ease}@keyframes pop{from{transform:scale(.97)}to{transform:scale(1)}}}
</style><main><header><strong>CLUE CANVAS</strong><a href="/">Back to game</a></header><h1>Puzzle playground</h1><p>Two new ways to play. Five puzzles each. Your main game progress stays untouched.</p><nav class="tabs" aria-label="Puzzle format"><button id="makeTab">Make the Saying</button><button id="linkTab">One Word Connects</button></nav><div id="game"></div><section class="feedback"><h2>Your verdict</h2><p class="muted">Notes stay on this device. Download them to send back for review.</p><div class="ratings"><button data-rating="Loved it">Loved it</button><button data-rating="Okay">Okay</button><button data-rating="Confusing">Confusing</button></div><label for="note">What would make this puzzle better?</label><textarea id="note" placeholder="Too easy? Unclear? Fun to move the words?"></textarea><p id="saveStatus" class="muted" role="status"></p><button id="download">Download feedback</button></section></main><script>
const make=[
{title:'Reading between the lines',tokens:['READING'],layout:'lines',answer:{READING:'middle'},hint:'The word belongs in the gap between the two gold lines.',why:'READING now sits between the lines.'},
{title:'Think outside the box',tokens:['THINK'],layout:'box',answer:{THINK:'outside'},hint:'Move THINK out of the outlined box.',why:'THINK is outside the box.'},
{title:'Under the weather',tokens:['YOU'],layout:'weather',answer:{YOU:'bottom'},hint:'Put YOU below WEATHER.',why:'YOU are under the WEATHER.'},
{title:'Mind over matter',tokens:['MIND','MATTER'],layout:'stack',answer:{MIND:'top',MATTER:'bottom'},hint:'MIND belongs above MATTER.',why:'MIND is over MATTER.'},
{title:'Head over heels',tokens:['HEAD','HEELS'],layout:'stack',answer:{HEAD:'top',HEELS:'bottom'},hint:'Put HEAD above HEELS.',why:'HEAD is over HEELS.'}
];
const links=[
{words:['TOOTH','PAINT','HAIR'],answer:'brush',hint:'Something with bristles.',why:'Toothbrush · paintbrush · hairbrush'},
{words:['SUN','MOON','FLASH'],answer:'light',hint:'It helps you see.',why:'Sunlight · moonlight · flashlight'},
{words:['FOOT','BASKET','SNOW'],answer:'ball',hint:'Think of something round.',why:'Football · basketball · snowball'},
{words:['BOOK','QUESTION','WATER'],answer:'mark',hint:'A sign, trace or symbol.',why:'Bookmark · question mark · watermark'},
{words:['PAN','BIRTHDAY','CUP'],answer:'cake',hint:'Something you might bake.',why:'Pancake · birthday cake · cupcake'}
];
let mode='make',index=0,selected=null,positions={},solved=false;const completed=new Set();let notes={};try{notes=JSON.parse(localStorage.getItem('cluecanvas-word-playtest-v1')||'{}')||{}}catch{}const game=document.querySelector('#game'),note=document.querySelector('#note');const key=()=>mode+'-'+index;const puzzle=()=>mode==='make'?make[index]:links[index];
function save(){try{localStorage.setItem('cluecanvas-word-playtest-v1',JSON.stringify(notes));document.querySelector('#saveStatus').textContent='Saved on this device.'}catch{document.querySelector('#saveStatus').textContent='Device storage unavailable. Download feedback before leaving.'}}
function render(){selected=null;positions={};solved=false;const p=puzzle();document.querySelector('#makeTab').setAttribute('aria-pressed',mode==='make');document.querySelector('#linkTab').setAttribute('aria-pressed',mode==='link');game.innerHTML=`<article class="card"><div class="eyebrow">${mode==='make'?'Make the Saying':'One Word Connects'} · ${index+1} of 5</div><progress value="${index+1}" max="5" aria-label="Puzzle ${index+1} of 5"></progress><h2 tabindex="-1">${mode==='make'?p.title:'Find the connecting word'}</h2><p>${mode==='make'?'Tap a word, then tap its destination. Arrange the scene to make the saying.':'Add the same word after each clue to make three familiar words or phrases.'}</p>${mode==='make'?'<div id="board" class="board"></div><div id="bank" class="bank"></div>':`<div class="words">${p.words.map(w=>`<div class="word">${w} ___</div>`).join('')}</div><form id="answerForm"><label for="answer">Connecting word</label><input id="answer" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="done"><button class="primary" style="width:100%;margin-top:12px">Check answer</button></form>`}<p id="message" role="status" aria-live="polite"></p><button id="hint">Show hint</button><p id="hintText"></p><div class="actions"><button id="previous" ${index===0?'disabled':''}>Previous</button><button id="reset">Retry</button><button id="next" class="primary">${index===4?'Finish set':'Next / skip'}</button></div></article>`;
if(mode==='make')draw();else document.querySelector('#answerForm').onsubmit=e=>{e.preventDefault();const correct=document.querySelector('#answer').value.trim().toLowerCase()===p.answer;if(correct)win();else document.querySelector('#message').textContent='Not quite. It must fit all three clues.'};document.querySelector('#hint').onclick=()=>document.querySelector('#hintText').textContent=p.hint;document.querySelector('#previous').onclick=()=>{index--;render()};document.querySelector('#reset').onclick=render;document.querySelector('#next').onclick=()=>{if(index<4){index++;render()}else finish()};note.value=notes[key()]?.note||'';refreshRatings();game.querySelector('h2').focus();}
function token(t){const b=document.createElement('button');b.className='token';b.textContent=t;b.setAttribute('aria-pressed',selected===t);b.onclick=()=>{if(solved)return;selected=t;draw();document.querySelector('#message').textContent=`${t} selected. Tap a destination.`};return b}
function zone(id,label){const b=document.createElement('button');b.className='zone';b.setAttribute('aria-label',label);const items=puzzle().tokens.filter(t=>positions[t]===id);b.textContent=items.length?items.join(' · '):label;b.onclick=()=>{if(solved)return;if(!selected){if(items.length){selected=items[0];draw()}else document.querySelector('#message').textContent='Select a word first.';return}positions[selected]=id;selected=null;draw();if(Object.entries(puzzle().answer).every(([t,z])=>positions[t]===z))win();else document.querySelector('#message').textContent='Keep arranging. Tap a placed word to move it again.'};return b}
function draw(){const b=document.querySelector('#board');b.replaceChildren();const p=puzzle();if(p.layout==='lines'){b.append(zone('top','Above the lines'));const l=document.createElement('div');l.className='line';b.append(l,zone('middle','Between the lines'));const l2=l.cloneNode();b.append(l2,zone('bottom','Below the lines'))}else if(p.layout==='box'){b.append(zone('outside','Outside the box'));const box=document.createElement('div');box.className='box';box.append(zone('inside','Inside the box'));b.append(box)}else if(p.layout==='weather'){b.append(zone('top','Above'));const a=document.createElement('div');a.className='anchor';a.textContent='WEATHER';b.append(a,zone('bottom','Below'))}else b.append(zone('top','Top position'),zone('bottom','Bottom position'));const bank=document.querySelector('#bank');bank.replaceChildren();p.tokens.filter(t=>!positions[t]).forEach(t=>bank.append(token(t)));}
function win(){solved=true;completed.add(key());const m=document.querySelector('#message');m.className='success';m.textContent='✓ '+puzzle().why;const next=document.querySelector('#next');next.textContent=index===4?'Finish set':'Next puzzle';}
function finish(){const count=[0,1,2,3,4].filter(i=>completed.has(mode+'-'+i)).length;game.innerHTML=`<article class="card"><h2>Set explored!</h2><p>You solved ${count} of 5 in this session. You can revisit skipped puzzles or try the other format.</p><button id="again">Revisit this set</button><button id="other" class="primary">Try ${mode==='make'?'One Word Connects':'Make the Saying'}</button></article>`;document.querySelector('#again').onclick=()=>{index=0;render()};document.querySelector('#other').onclick=()=>switchMode(mode==='make'?'link':'make')}
function switchMode(m){mode=m;index=0;render()};document.querySelector('#makeTab').onclick=()=>switchMode('make');document.querySelector('#linkTab').onclick=()=>switchMode('link');note.oninput=()=>{notes[key()]={...notes[key()],note:note.value};save()};function refreshRatings(){document.querySelectorAll('[data-rating]').forEach(b=>b.setAttribute('aria-pressed',notes[key()]?.rating===b.dataset.rating))}document.querySelectorAll('[data-rating]').forEach(b=>b.onclick=()=>{notes[key()]={...notes[key()],rating:b.dataset.rating};save();refreshRatings()});document.querySelector('#download').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,feedback:notes},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='cluecanvas-word-playtest-feedback.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};render();
</script></html>
