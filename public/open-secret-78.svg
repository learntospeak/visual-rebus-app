<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" role="img" aria-labelledby="title desc">
  <title id="title">A wide open envelope</title>
  <desc id="desc">An envelope with its flap raised and a card fully exposed inside.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f5e7c9"/>
    </linearGradient>
    <linearGradient id="envelope" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#84d8d0"/>
      <stop offset="1" stop-color="#2baba1"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#183b56" flood-opacity=".19"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <path d="M80 127 L210 38 L340 127 Z" fill="#c6f0ec" stroke="#183b56" stroke-width="6" stroke-linejoin="round"/>
    <rect x="116" y="75" width="188" height="142" rx="10" fill="url(#paper)" stroke="#d6c8aa" stroke-width="4"/>
    <path d="M72 123 H348 V235 Q348 247 336 247 H84 Q72 247 72 235 Z" fill="url(#envelope)" stroke="#183b56" stroke-width="6"/>
    <path d="M75 127 L210 219 L345 127" fill="#66c9c0" stroke="#183b56" stroke-width="5" stroke-linejoin="round"/>
    <path d="M74 242 L171 163 L210 219 L249 163 L346 242" fill="#36b3a9" opacity=".88"/>
    <rect x="156" y="104" width="108" height="65" rx="10" fill="#fff" stroke="#ff6b63" stroke-width="4" stroke-dasharray="7 6"/>
  </g>
</svg>
