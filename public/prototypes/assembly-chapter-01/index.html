<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ea">
<title>Clue Canvas — Assembly</title>
<link rel="stylesheet" href="./styles.css?v=12">
</head>
<body>
<main class="app-shell puzzle-screen has-compact-keyboard assembly-screen">
  <header class="puzzle-header">
    <button class="icon-button" id="backBtn" type="button" aria-label="Previous assembly">←</button>
    <div>
      <span class="eyebrow" id="levelHeader">ASSEMBLY 1 OF 5</span>
      <div class="mini-track" aria-hidden="true"><span id="headerProgress"></span></div>
    </div>
    <span class="difficulty difficulty-medium" id="difficultyBadge">Medium · 4/10</span>
  </header>

  <section class="puzzle-card assembly-puzzle-card">
    <div class="puzzle-art-frame assembly-art-frame">
      <div class="ac-board" id="board" aria-label="Assembly puzzle"></div>
      <div class="ac-solved-glow" id="solvedGlow" aria-hidden="true"></div>
    </div>
  </section>

  <section class="answer-form assembly-answer-form" id="answerPanel" hidden>
    <label for="answerInput">Your answer</label>
    <div class="answer-pattern" id="answerPattern" aria-label="Answer word pattern"></div>
    <input id="answerInput" autocomplete="off" autocapitalize="none" inputmode="none" readonly tabindex="-1" placeholder="Type the phrase…">
    <div class="compact-answer-keyboard" id="answerKeyboard" aria-label="On-screen answer keyboard"></div>
    <p class="feedback" id="answerFeedback" aria-live="polite">&nbsp;</p>
    <div class="action-row">
      <button type="button" class="secondary-button" id="clueBtn">Clue 1</button>
      <button type="button" class="primary-button" id="submitAnswerBtn">Submit</button>
    </div>
    <div class="clue-panel" id="cluePanel" hidden></div>
    <div class="reveal-panel" id="revealPanel" hidden>
      <p>Still stuck? You can reveal the answer and replay later to earn a better score.</p>
      <button type="button" class="text-button" id="revealAnswerBtn">Reveal answer</button>
    </div>
  </section>

  <section class="assembly-solved" id="completePanel" hidden>
    <div class="success-mark">✓</div>
    <p class="kicker">ASSEMBLY SOLVED</p>
    <h1 id="completePhrase"></h1>
    <p id="completeCopy"></p>
    <div class="solve-rating"><strong id="finalScore"></strong><span>Assembly score</span></div>
    <button type="button" class="primary-button full-button" id="nextBtn">Next assembly <span>→</span></button>
  </section>
</main>
<div class="ac-sr" id="live" aria-live="polite"></div>
<script src="./app.js?v=14" defer></script>
</body>
</html>
