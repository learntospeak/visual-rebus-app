<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" role="img" aria-labelledby="title desc">
  <title id="title">One and a roof</title>
  <desc id="desc">A large number one positioned directly above a standalone tiled roof.</desc>
  <defs>
    <linearGradient id="number" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8b7f"/>
      <stop offset="1" stop-color="#f05252"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#de5b52"/>
      <stop offset=".55" stop-color="#b93d43"/>
      <stop offset="1" stop-color="#812c39"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d2734"/>
      <stop offset="1" stop-color="#341c29"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#183b56" flood-opacity=".2"/>
    </filter>
  </defs>

  <text x="210" y="104" text-anchor="middle" fill="url(#number)"
        stroke="#d9444c" stroke-width="2"
        font-family="Manrope, Arial, sans-serif" font-size="104" font-weight="900">1</text>

  <g filter="url(#shadow)">
    <path d="M42 222 L202 126 Q210 121 218 126 L378 222 L354 244 L210 159 L66 244 Z"
          fill="url(#roof)" stroke="#652c38" stroke-width="6" stroke-linejoin="round"/>

    <g fill="none" stroke="#f08a76" stroke-width="4" stroke-linecap="round" opacity=".72">
      <path d="M83 218 L210 143 L337 218"/>
      <path d="M111 228 L210 169 L309 228"/>
      <path d="M142 235 L210 195 L278 235"/>
    </g>

    <g fill="none" stroke="#7d303b" stroke-width="3" opacity=".8">
      <path d="M116 178 L160 204"/>
      <path d="M160 151 L206 179"/>
      <path d="M304 178 L260 204"/>
      <path d="M260 151 L214 179"/>
      <path d="M174 220 L210 199 L246 220"/>
    </g>

    <path d="M44 221 L66 244 L210 159 L354 244 L378 222"
          fill="none" stroke="url(#edge)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M198 130 Q210 119 222 130 L230 146 L210 159 L190 146 Z"
          fill="#f28a72" stroke="#652c38" stroke-width="5" stroke-linejoin="round"/>

    <path d="M292 170 V111 H333 V195 Z" fill="#8e3d43" stroke="#572a35" stroke-width="5" stroke-linejoin="round"/>
    <path d="M284 111 H341 L334 95 H291 Z" fill="#4f2934" stroke="#341c29" stroke-width="5" stroke-linejoin="round"/>
    <path d="M301 121 H324" stroke="#d06a5c" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
