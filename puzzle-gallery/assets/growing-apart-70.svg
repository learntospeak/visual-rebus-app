<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" role="img" aria-labelledby="title desc">
  <title id="title">Two matching plants growing apart</title>
  <desc id="desc">Two normally proportioned terracotta pots with long stems curving away from one another.</desc>
  <defs>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb06f"/>
      <stop offset=".55" stop-color="#e77a4e"/>
      <stop offset="1" stop-color="#bd523a"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc083"/>
      <stop offset="1" stop-color="#dc6847"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9e842"/>
      <stop offset=".55" stop-color="#50b83c"/>
      <stop offset="1" stop-color="#16845a"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#183b56" flood-opacity=".18"/>
    </filter>
  </defs>

  <g id="plant" filter="url(#shadow)">
    <ellipse cx="118" cy="247" rx="48" ry="9" fill="#183b56" opacity=".10"/>

    <path d="M118 205 C116 168 101 132 78 103 C65 87 56 68 52 43" fill="none" stroke="#287d53" stroke-width="9" stroke-linecap="round"/>
    <path d="M78 103 C61 96 49 85 39 72" fill="none" stroke="#287d53" stroke-width="6" stroke-linecap="round"/>
    <path d="M99 137 C81 137 67 130 56 118" fill="none" stroke="#287d53" stroke-width="6" stroke-linecap="round"/>
    <path d="M65 86 C78 75 87 61 91 47" fill="none" stroke="#287d53" stroke-width="6" stroke-linecap="round"/>

    <ellipse cx="38" cy="65" rx="15" ry="28" fill="url(#leaf)" transform="rotate(-48 38 65)"/>
    <ellipse cx="52" cy="112" rx="15" ry="28" fill="url(#leaf)" transform="rotate(-55 52 112)"/>
    <ellipse cx="93" cy="44" rx="15" ry="28" fill="url(#leaf)" transform="rotate(28 93 44)"/>
    <ellipse cx="57" cy="86" rx="14" ry="26" fill="url(#leaf)" transform="rotate(42 57 86)"/>
    <ellipse cx="51" cy="39" rx="14" ry="25" fill="url(#leaf)" transform="rotate(-20 51 39)"/>

    <ellipse cx="118" cy="203" rx="34" ry="10" fill="#6f3f2d"/>
    <path d="M88 214 L148 214 L139 257 Q118 266 97 257 Z" fill="url(#pot)" stroke="#a74435" stroke-width="3"/>
    <rect x="80" y="201" width="76" height="22" rx="6" fill="url(#rim)" stroke="#a74435" stroke-width="3"/>
    <path d="M91 207 H145" stroke="#ffd09c" stroke-width="4" stroke-linecap="round" opacity=".65"/>
  </g>

  <use href="#plant" transform="translate(420 0) scale(-1 1)"/>
</svg>
